{% extends "base.html" %}

{% block content %}
<h1>编辑角色铭牌</h1>
<form method="post">
    {% for i in range(1,3) %}
    <div class="card mb-3">
        <div class="card-header">角色{{ i }}</div>
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">角色名</label>
                <input type="text" name="char{{ i }}_name" class="form-control" value="{{ characters[i-1].name }}">
            </div>
            <div class="mb-3">
                <label class="form-label">部队名</label>
                <input type="text" name="char{{ i }}_fc" class="form-control"
                    value="{{ characters[i-1].free_company }}">
            </div>
            <div class="mb-3">
                <label class="form-label">主城</label>
                <input type="text" name="char{{ i }}_city" class="form-control" value="{{ characters[i-1].city }}">
            </div>
            <div class="mb-3">
                <label class="form-label">开始冒险日期</label>
                <input type="date" name="char{{ i }}_start_date" class="form-control"
                    value="{{ characters[i-1].start_date }}">
            </div>
            <div class="mb-3">
                <label class="form-label">铭牌截图URL</label>
                <input type="url" name="char{{ i }}_badge" class="form-control"
                    value="{{ characters[i-1].badge_image }}">
            </div>
            <div class="mb-3">
                <label class="form-label">背靠图URL</label>
                <input type="url" name="char{{ i }}_background" class="form-control"
                    value="{{ characters[i-1].background_image }}">
                <div class="form-text">设置角色卡片的背景图片，建议使用较浅的图片以免文字看不清。</div>
            </div>
        </div>
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">保存</button>
    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary">返回</a>
</form>
{% endblock %}
