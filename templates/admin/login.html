<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 — FF14 个人主页</title>
    <script>
        (function () {
            var theme = 'nier';
            try {
                var saved = localStorage.getItem('yukiko-visual-theme');
                if (saved === 'ffxiv' || saved === 'nier' || saved === 'blue-pop') theme = saved;
            } catch (error) { /* Use the original default when storage is unavailable. */ }
            document.documentElement.dataset.theme = theme;
        }());
    </script>
    <link href="{{ versioned_static('vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ versioned_static('vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ versioned_static('css/style.css') }}">
    <link rel="stylesheet" href="{{ versioned_static('css/theme-switcher.css') }}">
    <script>
        if (document.documentElement.dataset.theme === 'nier') {
            document.write('<link rel="stylesheet" href="{{ versioned_static('css/nier-terminal.css') }}">');
        } else if (document.documentElement.dataset.theme === 'blue-pop') {
            document.write('<link rel="stylesheet" href="{{ versioned_static('css/blue-pop.css') }}">');
        }
    </script>
</head>
<body class="nier-terminal terminal-login" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <script>
        document.body.dataset.theme = document.documentElement.dataset.theme;
        document.body.classList.toggle('nier-terminal', document.body.dataset.theme === 'nier');
    </script>
    <div class="container" style="max-width:400px;">
        <div class="content-card text-center">
            <div class="mb-4">
                <i class="fa-solid fa-crown fa-2x" style="color:var(--ff-gold);"></i>
                <h4 class="text-gold mt-2" style="font-family:'Cinzel',serif;">管理员登录</h4>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="post">
                <div class="mb-3 text-start">
                    <label class="form-label" style="color:var(--ff-text-muted);">
                        <i class="fa-regular fa-user me-1"></i>用户名
                    </label>
                    <input type="text" class="form-control form-control-ff" name="username" required
                        placeholder="输入管理员用户名">
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label" style="color:var(--ff-text-muted);">
                        <i class="fa-solid fa-lock me-1"></i>密码
                    </label>
                    <input type="password" class="form-control form-control-ff" name="password" required
                        placeholder="输入密码">
                </div>
                <button type="submit" class="btn btn-ff w-100">
                    <i class="fa-solid fa-right-to-bracket me-1"></i>登录
                </button>
            </form>

            <div class="mt-3">
                <a href="/" class="btn btn-ff-outline btn-sm">
                    <i class="fa-solid fa-arrow-left me-1"></i>返回首页
                </a>
            </div>
        </div>
    </div>

    <script src="{{ versioned_static('vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
